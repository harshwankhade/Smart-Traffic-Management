syntax = "proto3";

package smarttraffic.v1;

// Approved planned v1 contract. No generated stubs or implementation yet.
// Acknowledgement semantics follow the Phase 1 decision register.
service EventPublisher {
  rpc PublishReading(ReadingEvent) returns (PublishReceipt);
}

message ReadingEvent {
  string schema_version = 1; // "1.0"
  string event_id = 2; // Stable across retries.
  string sensor_id = 3;
  string intersection_id = 4;
  string observed_at = 5; // UTC RFC3339 ending in Z.
  optional int64 vehicle_count = 6;
  optional double average_speed = 7; // km/h
  optional double occupancy = 8; // [0,1]
}

message PublishReceipt {
  string event_id = 1;
  bool accepted = 2; // Proposed: archive and Kafka acknowledgement obtained.
}
