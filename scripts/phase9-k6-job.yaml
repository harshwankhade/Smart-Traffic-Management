apiVersion: batch/v1
kind: Job
metadata:
  generateName: phase9-k6-
  namespace: smarttraffic
  labels:
    app.kubernetes.io/name: phase9-k6
    phase: "9"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phase9-k6
        phase: "9"
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          args: ["run", "/scripts/phase9_load.js"]
          env:
            - name: RUN_ID
              value: "phase9-200vu-incluster"
            - name: REGISTRY_URL
              value: "http://sensor-registry.smarttraffic.svc.cluster.local:8000"
            - name: INGESTION_URL
              value: "http://traffic-ingestion.smarttraffic.svc.cluster.local:8000"
            - name: ANALYTICS_URL
              value: "http://traffic-analytics.smarttraffic.svc.cluster.local:8000"
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: phase9-k6-script
