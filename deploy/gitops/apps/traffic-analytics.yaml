apiVersion: v1
kind: ServiceAccount
metadata:
  name: traffic-analytics
  namespace: smarttraffic
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-analytics
  namespace: smarttraffic
spec:
  selector: {app: traffic-analytics}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-analytics
  namespace: smarttraffic
spec:
  replicas: 1
  selector: {matchLabels: {app: traffic-analytics}}
  template:
    metadata: {labels: {app: traffic-analytics}}
    spec:
      serviceAccountName: traffic-analytics
      containers:
        - name: app
          image: smarttraffic/traffic-analytics:phase8-local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: smarttraffic-runtime}
            - secretRef: {name: traffic-analytics-runtime}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 15}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
