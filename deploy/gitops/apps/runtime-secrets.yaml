apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: smarttraffic-aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
---
# The remote value contains runtime identifiers and RDS secret ARNs, not a
# database password. The two database services retrieve their password through
# their own Pod Identity role at connection time.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smarttraffic-runtime-values
  namespace: smarttraffic
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: smarttraffic-aws-secrets
  target:
    name: smarttraffic-runtime-values
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: smarttraffic-phase8-runtime-config
