apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-manager
  namespace: smarttraffic
---
apiVersion: v1
kind: Service
metadata:
  name: incident-manager
  namespace: smarttraffic
spec:
  selector: {app: incident-manager}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-manager
  namespace: smarttraffic
spec:
  replicas: 1
  selector: {matchLabels: {app: incident-manager}}
  template:
    metadata: {labels: {app: incident-manager}}
    spec:
      serviceAccountName: incident-manager
      containers:
        - name: app
          image: smarttraffic/incident-manager:phase8-local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: smarttraffic-runtime}
            - secretRef: {name: incident-manager-runtime}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
