apiVersion: v1
kind: ServiceAccount
metadata:
  name: sensor-registry
  namespace: smarttraffic
---
apiVersion: v1
kind: Service
metadata:
  name: sensor-registry
  namespace: smarttraffic
spec:
  selector: {app: sensor-registry}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-registry
  namespace: smarttraffic
spec:
  replicas: 1
  selector: {matchLabels: {app: sensor-registry}}
  template:
    metadata: {labels: {app: sensor-registry}}
    spec:
      serviceAccountName: sensor-registry
      containers:
        - name: app
          image: smarttraffic/sensor-registry:phase8-local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: smarttraffic-runtime}
            - secretRef: {name: sensor-registry-runtime}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
