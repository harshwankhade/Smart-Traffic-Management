apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: kafka-tls, namespace: smarttraffic}
spec:
  refreshInterval: 1m
  secretStoreRef: {kind: ClusterSecretStore, name: smarttraffic-aws-secrets}
  target: {name: kafka-tls, creationPolicy: Owner}
  dataFrom:
    - extract: {key: smarttraffic-phase8-kafka-tls}
---
apiVersion: v1
kind: Service
metadata: {name: kafka-headless, namespace: smarttraffic}
spec:
  clusterIP: None
  selector: {app: kafka}
  ports:
    - {name: tls, port: 9093}
---
# Private VPC DNS lets EMR reach the same advertised broker as EKS clients.
# Cross-zone forwarding is required for a single broker behind two NLB subnets.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: smarttraffic
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
    external-dns.kubernetes.io/hostname: kafka.smarttraffic.internal
spec:
  type: LoadBalancer
  loadBalancerClass: service.k8s.aws/nlb
  loadBalancerSourceRanges: [10.80.0.0/16]
  selector: {app: kafka}
  ports:
    - {name: tls, port: 9093, targetPort: 9093}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: kafka-config, namespace: smarttraffic}
data:
  server.properties: |
    process.roles=broker,controller
    node.id=1
    controller.quorum.voters=1@127.0.0.1:9094
    controller.listener.names=CONTROLLER
    listeners=SSL://:9093,CONTROLLER://127.0.0.1:9094
    advertised.listeners=SSL://kafka.smarttraffic.internal:9093
    listener.security.protocol.map=SSL:SSL,CONTROLLER:PLAINTEXT
    inter.broker.listener.name=SSL
    ssl.keystore.type=PEM
    ssl.keystore.location=/work/broker.pem
    ssl.truststore.type=PEM
    ssl.truststore.location=/tls/tls.crt
    ssl.client.auth=none
    log.dirs=/var/lib/kafka/data/logs
    auto.create.topics.enable=false
    num.partitions=1
    default.replication.factor=1
    min.insync.replicas=1
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    log.retention.hours=6
    log.retention.bytes=536870912
    log.segment.bytes=134217728
    num.network.threads=2
    num.io.threads=2
  client.properties: |
    security.protocol=SSL
    ssl.truststore.type=PEM
    ssl.truststore.location=/tls/tls.crt
    ssl.endpoint.identification.algorithm=https
    request.timeout.ms=5000
    default.api.timeout.ms=10000
  bootstrap-topics.sh: |
    #!/bin/bash
    set -euo pipefail
    ready=false
    for attempt in {1..60}; do
      if /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9093 --command-config /config/client.properties --list; then
        ready=true
        break
      fi
      sleep 2
    done
    "$ready" || exit 1
    for topic in traffic.raw traffic.results; do
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9093 --command-config /config/client.properties --create --if-not-exists --topic "$topic" --partitions 1 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=21600000 --config retention.bytes=536870912
    done
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: kafka, namespace: smarttraffic}
spec:
  serviceName: kafka-headless
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      terminationGracePeriodSeconds: 60
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          command: [/bin/bash, -ec]
          args:
            - |
              cat /tls/tls.key /tls/tls.crt > /work/broker.pem
              /opt/kafka/bin/kafka-storage.sh format --ignore-formatted -t MkU3OEVBNTcwNTJENDM2Qk -c /config/server.properties
              exec /opt/kafka/bin/kafka-server-start.sh /config/server.properties
          env:
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m"}
          ports:
            - {name: tls, containerPort: 9093}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "1", memory: 1536Mi}
          lifecycle:
            postStart:
              exec: {command: [/bin/bash, /config/bootstrap-topics.sh]}
          startupProbe:
            tcpSocket: {port: tls}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [/opt/kafka/bin/kafka-topics.sh, --bootstrap-server, "localhost:9093", --command-config, /config/client.properties, --describe, --topic, traffic.results]
            periodSeconds: 30
            timeoutSeconds: 15
          livenessProbe:
            tcpSocket: {port: tls}
            periodSeconds: 20
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: work, mountPath: /work}
      volumes:
        - name: config
          configMap: {name: kafka-config}
        - name: tls
          secret: {secretName: kafka-tls, defaultMode: 0440}
        - name: work
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: smarttraffic-gp3
        resources: {requests: {storage: 4Gi}}
