apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: smarttraffic
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-service-routing
  namespace: smarttraffic
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: kafka-from-private-vpc, namespace: smarttraffic}
spec:
  podSelector: {matchLabels: {app: kafka}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 10.80.0.0/16}
      ports:
        - {protocol: TCP, port: 9093}
