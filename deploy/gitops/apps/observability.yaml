apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smarttraffic-kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 75.15.1
    helm:
      values: |
        grafana:
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 300m, memory: 512Mi}
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
            retention: 7d
            resources:
              requests: {cpu: 250m, memory: 1Gi}
              limits: {cpu: 750m, memory: 2Gi}
  destination:
    server: https://kubernetes.default.svc
    namespace: smarttraffic-observability
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smarttraffic-phase9-observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/harshwankhade/Smart-Traffic-Management.git
    targetRevision: main
    path: deploy/gitops/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: smarttraffic-observability
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smarttraffic-phase9-metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.12.2
    helm:
      values: |
        metrics:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
